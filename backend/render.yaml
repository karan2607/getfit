# Two environments, same blueprint.
#
# Everything deploys to STAGING first and is promoted to main by hand. Before
# this existed, `main` went straight to production with only the local test
# gate in front of it -- which is how the Django 5 outage shipped (green
# locally on 4.2, broken on production's 5.x) and why every UI change went out
# with no automated coverage at all.
#
# Staging points at a Neon BRANCH of the production database, so a migration
# that mutates rows can be run against real-shaped data first. Every such
# migration so far (the Composite conversion, upgrade steps 6 and 7) was
# verified against synthetic fixtures because the local database is empty.
services:
  - type: web
    name: getfit-backend
    runtime: python
    # upgrade_data repairs already-created plans in place after the schema
    # migrations land. It is idempotent, so re-running on every deploy is safe.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py upgrade_data
    startCommand: gunicorn config.wsgi --workers 1 --threads 4 --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Declared but NOT set in production today. api/email.py prints the
      # password-reset link to the logs when it is absent, which is why the
      # superuser reset tooling exists -- see views.admin_reset. Set this to
      # enable real self-service resets.
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FROM_EMAIL
        value: GetFit <noreply@resend.dev>

  # ---------------------------------------------------------------------------
  # Staging. Identical build and runtime to production on purpose: a staging
  # environment that differs from production tests the wrong thing.
  #
  # DEBUG stays False to match production. Setting it True here would hide the
  # exact class of failure staging exists to catch -- the Django 5 outage was
  # a prod-only break, and a tracebackless 500 is part of what prod looks like.
  # ---------------------------------------------------------------------------
  - type: web
    name: getfit-backend-staging
    runtime: python
    branch: staging
    # Free tier spins down when idle, so the first request after a quiet spell
    # takes ~50s. Acceptable for staging; do not copy this to production.
    plan: free
    # reset_staging --check runs FIRST, before migrate and upgrade_data touch
    # a single row. If DATABASE_URL ever resolves to the production host the
    # build fails and nothing runs.
    #
    # It is in the build command rather than something to run by hand because
    # the free plan has NO SHELL -- there is no way to run the guard manually
    # here. Putting it in the build turns a one-time check into a gate on every
    # staging deploy, which is strictly better anyway. --check makes no
    # database connection; it only compares settings against PRODUCTION_DB_HOST.
    # The trailing --counts prints row counts into the BUILD LOG, which is the
    # only way to read them without a shell. Diff them against production
    # before promoting a row-mutating migration.
    buildCommand: pip install -r requirements.txt && python manage.py reset_staging --check && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py upgrade_data && python manage.py reset_staging --counts
    startCommand: gunicorn config.wsgi --workers 1 --threads 4 --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      # MUST be the Neon `staging` branch, never the production database.
      # api/management/commands/reset_staging.py refuses to run if this points
      # at the same database as production.
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Shares production's key, so staging burns the same credits. Worth
      # knowing before generating plans here in a loop.
      - key: GEMINI_API_KEY
        sync: false
      # reset_staging compares DATABASE_URL's host against this and REFUSES
      # to run if they match. Unset also refuses -- an unset variable is the
      # likeliest way to end up pointed at production by accident.
      - key: PRODUCTION_DB_HOST
        sync: false
      # No SENTRY_DSN: staging noise in the production Sentry project would
      # make real alerts worth less.
      #
      # No RESEND_API_KEY / FROM_EMAIL either. Outbound email has never been
      # configured on this project -- api/email.py prints the reset link to the
      # logs when the key is absent, which is why the superuser reset tooling
      # exists. Listing them here implied they were set and sent someone
      # looking for a key that does not exist.

# -----------------------------------------------------------------------------
# The FRONTEND IS NOT ON RENDER. It is on Vercel, and has been since the first
# commit -- `frontend/vercel.json` carries the SPA rewrite.
#
# An earlier version of this file declared `getfit-frontend` and
# `getfit-staging` as Render static sites. Neither exists. Writing them here
# sent someone into the Render dashboard looking for a Redirects/Rewrites tab
# on a service that was never going to have one.
#
# What that means for staging:
#   - Vercel builds a PREVIEW deployment for every branch automatically, so
#     pushing to `staging` needs no new service. The stable branch alias is
#     what CORS_ALLOWED_ORIGINS above must list -- NOT a per-commit URL, which
#     changes on every deploy.
#   - VITE_API_URL is scoped per environment in Vercel. Preview must point at
#     getfit-backend-staging; Production keeps pointing at getfit-backend.
#   - The SPA rewrite is already committed in frontend/vercel.json and applies
#     to previews too. There is nothing to configure by hand.
#
# See docs/STAGING.md.
# -----------------------------------------------------------------------------
