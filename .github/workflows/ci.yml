name: CI

# Runs on every push and PR. Before this, the repo had no tests and no CI, so
# cross-layer regressions (an AI schema change breaking the serializer, a
# serializer change breaking the frontend) only surfaced in production.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what production runs, so it is the version that decides
        # whether a deploy works; 3.12 is the floor the code must still build
        # on. requirements.txt pins only `django>=4.2`, so the Python version
        # decides the Django major. Testing only 3.9 is how
        # `django.utils.timezone.utc` (removed in Django 5.0) reached
        # production and 500'd the health page -- a matrix that omits the
        # production version is the same gap, so 3.14 is not optional here.
        #
        # 3.9 was dropped when the `anthropic` SDK arrived: it requires
        # >= 3.10. Keeping 3.9 would have meant hand-rolling the tool-call
        # loop, and 3.9 local against 3.14 production was itself the outage
        # pattern above.
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-not-a-real-secret
      # DEBUG=True keeps settings.py on SQLite. With DEBUG=False it now refuses
      # to start without a postgres DATABASE_URL, which is deliberate.
      DEBUG: 'True'
      GEMINI_API_KEY: ''
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Fail if models drifted from migrations
        # Catches a model field added without a matching migration — which would
        # otherwise only explode during the Render build.
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply from scratch
        run: python manage.py migrate --noinput

      - name: Data upgrades are safe to run
        run: python manage.py upgrade_data --dry-run

      - name: Tests
        run: python manage.py test api.tests --verbosity 2

      # The frontend mirrors exercise_types.FIELD_CONTRACT by hand, and it
      # drifted: two types were added server-side and 40 rows reclassified onto
      # them while the frontend still knew five, so a treadmill rendered weight
      # and reps inputs the server then discarded. This fails the build if the
      # server contract changes and the exported fixture was not regenerated.
      - name: Frontend contract is in step with the server
        run: python manage.py export_set_contract --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The green everyone wanted gone was 183 ad-hoc `emerald-*` classes and
      # a handful of hardcoded hex values, not the brand token. Each one looks
      # harmless in its own diff, so the rule is enforced mechanically rather
      # than by review. NOT chained behind `npm run lint`: that already fails
      # on 20 pre-existing errors, so `&&` would mean this never runs.
      - name: Palette
        run: npm run check:palette

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # Layout is asserted at the width the app is actually used at. A
      # desktop-width screenshot cannot show a bottom nav covering an input
      # or a tap target under 44px, and this app is used on a phone.
      - name: Install browsers for the 390px gate
        run: npx playwright install --with-deps webkit

      - name: Mobile layout gate (390px, WebKit)
        run: npm run test:e2e
